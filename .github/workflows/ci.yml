name: offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev --extra plots
      - run: uv run --frozen --extra dev --extra plots pytest
      - run: uv run --frozen --extra dev --extra plots ruff check .
      - run: uv run --frozen --extra dev --extra plots mypy src
      - run: uv run --frozen --extra dev --extra plots llmka run-all --config configs/mock.yaml
