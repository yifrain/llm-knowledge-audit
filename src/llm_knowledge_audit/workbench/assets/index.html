<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Knowledge audit · Research console</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/i18n.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="/">Knowledge audit</a>
    <span data-i18n="console">Research console</span>
    <label class="language"><span data-i18n="language">Language</span>
      <select id="language" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option></select>
    </label>
  </header>
  <div class="workspace">
    <nav aria-label="Workspace" id="nav">
      <button data-page="runs" data-i18n="runs">Runs</button>
      <button data-page="inspect" data-i18n="inspect">Inspect</button>
      <button data-page="review" data-i18n="review">Review</button>
      <button data-page="exports" data-i18n="exports">Reports & exports</button>
    </nav>
    <main id="main"></main>
  </div>
  <div id="notice" role="status" aria-live="polite"></div>
  <footer><span data-i18n="local">Local only · Immutable run artifacts</span>
    <details><summary data-i18n="terms">Terminology</summary><p data-i18n="glossary">Gold: reference entity. NEI: not enough information. Mock: synthetic software check. Reservation: conservative budget held before an API attempt.</p></details>
  </footer>
</body>
</html>
